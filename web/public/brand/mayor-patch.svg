<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mayor Patch">
  <!-- Mayor Patch, the StreetCreds mascot: a friendly chibi mayor waving hello. -->
  <circle cx="100" cy="100" r="100" fill="#FF7A1A"/>
  <g stroke="#1A1210" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- shadow -->
    <ellipse cx="100" cy="188" rx="40" ry="6" fill="#C4570C" stroke="none"/>
    <!-- legs and shoes -->
    <rect x="80" y="158" width="16" height="22" rx="4" fill="#1F1A18"/>
    <rect x="104" y="158" width="16" height="22" rx="4" fill="#1F1A18"/>
    <ellipse cx="86" cy="182" rx="14" ry="7" fill="#151110"/>
    <ellipse cx="114" cy="182" rx="14" ry="7" fill="#151110"/>
    <!-- left arm, down -->
    <path d="M66 118 Q56 140 62 158" fill="none" stroke="#1A1210" stroke-width="16"/>
    <path d="M66 118 Q56 140 62 158" fill="none" stroke="#2A2420" stroke-width="10"/>
    <circle cx="62" cy="161" r="8" fill="#C68A5E"/>
    <!-- body: suit -->
    <path d="M64 120 Q64 108 80 106 L120 106 Q136 108 136 120 L138 164 Q100 172 62 164 Z" fill="#2A2420"/>
    <!-- shirt and lapels -->
    <path d="M88 106 L100 132 L112 106 Z" fill="#F4ECE4"/>
    <path d="M86 106 L100 136 L92 150 L78 112 Z" fill="#1F1A18"/>
    <path d="M114 106 L100 136 L108 150 L122 112 Z" fill="#1F1A18"/>
    <!-- tie -->
    <path d="M96 110 L104 110 L102 116 L106 140 L100 148 L94 140 L98 116 Z" fill="#D62828"/>
    <!-- gold badge -->
    <circle cx="121" cy="128" r="6" fill="#FFB02E"/>
    <path d="M117 133 L115 143 L119 140 L121 144 L123 140 L127 143 L125 133" fill="#D62828" stroke-width="2"/>
    <!-- right arm, waving -->
    <path d="M134 116 Q150 104 152 84" fill="none" stroke="#1A1210" stroke-width="16"/>
    <path d="M134 116 Q150 104 152 84" fill="none" stroke="#2A2420" stroke-width="10"/>
    <!-- waving hand -->
    <g fill="#C68A5E">
      <rect x="143" y="62" width="20" height="22" rx="8"/>
      <rect x="144" y="54" width="5" height="14" rx="2.5"/>
      <rect x="150" y="51" width="5" height="16" rx="2.5"/>
      <rect x="156" y="53" width="5" height="15" rx="2.5"/>
      <rect x="160" y="68" width="10" height="5" rx="2.5" transform="rotate(-30 165 70)"/>
    </g>
    <!-- head -->
    <circle cx="66" cy="66" r="9" fill="#C68A5E"/>
    <circle cx="134" cy="66" r="9" fill="#C68A5E"/>
    <ellipse cx="100" cy="64" rx="34" ry="36" fill="#C68A5E"/>
    <!-- hair: dark sides and a slicked top -->
    <path d="M67 62 Q66 30 100 28 Q134 30 133 62 Q128 46 118 44 Q100 40 82 44 Q72 46 67 62 Z" fill="#2B201B"/>
    <path d="M84 36 Q100 30 116 36" fill="none" stroke="#5A4639" stroke-width="2"/>
    <!-- cheeks -->
    <ellipse cx="78" cy="78" rx="6" ry="4" fill="#E0876A" stroke="none" opacity=".7"/>
    <ellipse cx="122" cy="78" rx="6" ry="4" fill="#E0876A" stroke="none" opacity=".7"/>
    <!-- glasses -->
    <circle cx="86" cy="64" r="11" fill="#F4ECE4"/>
    <circle cx="114" cy="64" r="11" fill="#F4ECE4"/>
    <path d="M97 64 L103 64" fill="none"/>
    <!-- eyes -->
    <circle cx="87" cy="65" r="4.5" fill="#1A1210" stroke="none"/>
    <circle cx="113" cy="65" r="4.5" fill="#1A1210" stroke="none"/>
    <circle cx="88.5" cy="63.5" r="1.4" fill="#fff" stroke="none"/>
    <circle cx="114.5" cy="63.5" r="1.4" fill="#fff" stroke="none"/>
    <!-- eyebrows -->
    <path d="M78 50 Q86 46 93 50" fill="none" stroke-width="3.5"/>
    <path d="M107 50 Q114 46 122 50" fill="none" stroke-width="3.5"/>
    <!-- mustache and smile -->
    <path d="M100 82 Q92 76 82 82 Q86 90 100 86 Q114 90 118 82 Q108 76 100 82 Z" fill="#2B201B"/>
    <path d="M93 92 Q100 97 107 92" fill="none" stroke-width="2.5"/>
  </g>
</svg>
