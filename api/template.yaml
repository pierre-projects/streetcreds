AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: StreetCreds API. One Lambda behind an HTTP API, three DynamoDB tables and one private photo bucket.

# Deploy with `npm run deploy` in api/ (humans only). Stack name: streetcreds. Region: us-east-2 (the AWS project is locked to it).
# The answers to `sam deploy --guided` are saved in samconfig.toml, which is git-ignored.
#
# Do not run `sam build`. The code is bundled by `npm run build` into dist/index.js, and SAM uploads
# that folder as it is. `sam build` works on a copy of api/ that cannot see ../shared.

Parameters:
  WebOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Every address the web app is served from, comma-separated with no spaces. Add the Amplify URL and https://streetcreds.app here.
  # `sam deploy --guided` will not accept an empty answer for a secret (NoEcho) parameter.
  # Type the word none to leave one empty; the Conditions below turn none into an empty value.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: none
    Description: Gemini API key from Google AI Studio. Secret. Type none to leave it empty.
  GeminiModel:
    Type: String
    Default: gemini-3.8-flash
  SolanaMode:
    Type: String
    Default: 'off'
    AllowedValues:
      - 'off'
      - per-player
      - shared
    Description: Leave on off until the treasury and the CIVIC mint exist.
  SolanaTreasurySecret:
    Type: String
    NoEcho: true
    Default: none
    Description: Base64 of the devnet treasury secret key. Secret. Type none while SolanaMode is off.
  CivicMint:
    Type: String
    Default: none
    Description: Address of the CIVIC mint on devnet. Leave as none while SolanaMode is off.

Conditions:
  NoGeminiApiKey: !Equals [!Ref GeminiApiKey, none]
  NoSolanaTreasurySecret: !Equals [!Ref SolanaTreasurySecret, none]
  NoCivicMint: !Equals [!Ref CivicMint, none]

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS for deployed requests is handled here. Do not add Hono's cors() to src/index.ts as well.
      CorsConfiguration:
        AllowOrigins: !Ref WebOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 600

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # dist/ holds one file, index.js, written by `npm run build`. It is git-ignored.
      CodeUri: dist/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      # The HTTP API cuts requests off at 30 seconds.
      Timeout: 29
      Environment:
        Variables:
          TABLE_PLAYERS: !Ref PlayersTable
          TABLE_REPORTS: !Ref ReportsTable
          TABLE_AWARDS: !Ref AwardsTable
          PHOTO_BUCKET: !Ref PhotoBucket
          WEB_ORIGINS: !Join [',', !Ref WebOrigins]
          GEMINI_API_KEY: !If [NoGeminiApiKey, '', !Ref GeminiApiKey]
          GEMINI_MODEL: !Ref GeminiModel
          SOLANA_MODE: !Ref SolanaMode
          SOLANA_RPC_URL: https://api.devnet.solana.com
          SOLANA_TREASURY_SECRET: !If [NoSolanaTreasurySecret, '', !Ref SolanaTreasurySecret]
          CIVIC_MINT: !If [NoCivicMint, '', !Ref CivicMint]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AwardsTable
        - S3CrudPolicy:
            BucketName: !Ref PhotoBucket
      Events:
        # No Path or Method: this is the $default route, so every request reaches the Hono app.
        AnyRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: streetcreds-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: streetcreds-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  AwardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: streetcreds-awards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Private. Photos are uploaded and shown through presigned links only.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - GET
            AllowedOrigins: !Ref WebOrigins
            AllowedHeaders:
              - '*'
            MaxAge: 3000

Outputs:
  ApiUrl:
    Description: Base URL of the API. Use it as VITE_API_URL.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  PhotoBucketName:
    Description: Name of the photo bucket. Use it as PHOTO_BUCKET in api/.env.
    Value: !Ref PhotoBucket
