# AWS Amplify Hosting build for the web app. In the Amplify console: monorepo, app root `web`,
# and the environment variable VITE_API_URL set to the API stack's ApiUrl output.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
